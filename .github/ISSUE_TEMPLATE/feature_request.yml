name: Feature request
description: Suggest an idea for Protractor
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build or do?
      description: Describe the problem first, then any solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
